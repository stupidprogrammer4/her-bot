[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "her-contracts"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "amupouya-calendar @ https://codeload.github.com/stupidprogrammer4/rick-and-morty/tar.gz/68988ea0f6caf8dd5a8a2bd3368f7b1a2d3520a8#subdirectory=packages/calendar",
  "pydantic==2.12.5",
]

[tool.setuptools.packages.find]
include = ["her_contracts*"]
